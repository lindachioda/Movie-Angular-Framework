

<mat-card class="container-card" appearance="outlined"  *ngFor="let film of filtratiGeneri">
    <!--prendi i film dal gruppo di film filtrati per genere-->


    <mat-card-title><span [appHighlight]="`rgba(135, 206, 250, 0.669)`">{{film.title}}</span></mat-card-title>
    <p class="subtitle"><span>Titolo originale:</span></p> 
      <p class="subtitle">{{film.original_title}}</p>
    <p class="subtitle"><span>Lingua:</span> {{film.original_language}}</p>
 
  <img [src]="'https://image.tmdb.org/t/p/w500' + film.poster_path" [alt]="film.title">

  <p class="overview">{{film.overview}}</p>
  
   <mat-card-subtitle class="popularity"><span>Popolarità:</span> {{film.popularity}}</mat-card-subtitle>
   <div class="container-voto">
   <p>Vote avarage: {{film.vote_average}}</p>
   <p>Vote count: {{film.vote_count}}</p>
   </div>
</mat-card>
